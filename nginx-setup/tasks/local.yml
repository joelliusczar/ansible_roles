---
- name: Add test url to hosts file.
  become: true
  lineinfile:
    path: /etc/hosts
    line: '{{inventory_hostname}}{{""|indent(8, True)}}{{__common_name_ngx__}}'
  when: __env_name_ngx__ != "debug"
- name: Generate local cert
  include_role:
    name: local-cert-setup
  vars:
    local_env_name: '{{__env_name_ngx__}}'
    local_common_name: '{{__common_name_ngx__}}'
- name: Create snippets directory
  become: true
  file:
    path: /etc/nginx/sites-enabled/snippets/optional.d
    state: directory
- name: Copy ssl snippets
  become: true
  template:
    src: security_snippets_template.j2
    dest: /etc/nginx/sites-enabled/snippets/security.conf
    validate: 'nginx -t -c %s'
- name: Replace web config
  become: true
  template: 
    src: nginx_template.j2
    dest: '/etc/nginx/sites-enabled/{{__conf_name_ngx__}}.conf'
    validate: 'nginx -t -c %s'
  vars:
    listen: 8080 ssl
  notify: Restart nginx
  when: __env_name_ngx__ != "debug"